name: Deploy Live Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Allows you to manually trigger a fresh run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Prevents canceling a deployment that is already running
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ... keep your Node setup and build steps here ...

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Ensure this matches your actual build output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
