name: VYTAL Automated CI Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend Pytest (75 Clinical & ML Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Execute Backend Tests with Pytest
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./test_vytal.db
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v

  frontend-quality-gate:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Execute Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Verify TypeScript & Build Bundle
        working-directory: frontend
        run: npm run build

  mobile-quality-gate:
    name: Mobile Expo Typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install

      - name: Verify Mobile TypeScript Type Safety
        working-directory: mobile
        run: npx tsc --noEmit
