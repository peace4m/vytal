<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vytalTealEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="vytalGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Ambient Shape (Optional for stand-alone) -->
  <rect width="100" height="100" rx="24" fill="url(#vytalGlow)" />

  <!-- V-Pulse Waveform Path -->
  <path
    d="M22 26 L40 70 L47 79 L54 34 L62 68 L68 58 L78 26"
    stroke="url(#vytalTealEmerald)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softShadow)"
  />

  <!-- Vital Lens / Pulse Peak Dot -->
  <circle cx="54" cy="34" r="4.5" fill="#10b981" />
  <circle cx="54" cy="34" r="2" fill="#ffffff" />
</svg>
