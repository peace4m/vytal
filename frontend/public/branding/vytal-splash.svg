<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="splashPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#14b8a6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="800" height="1200" fill="url(#splashBg)" />

  <!-- Center Emblem Card -->
  <g transform="translate(300, 420)">
    <rect width="200" height="200" rx="48" fill="#111827" stroke="#1f2937" stroke-width="2" />
    <path
      d="M48 60 L80 134 L94 150 L108 72 L124 130 L136 114 L154 60"
      stroke="url(#splashPulseGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#splashGlow)"
    />
    <circle cx="108" cy="72" r="9" fill="#10b981" />
    <circle cx="108" cy="72" r="4" fill="#ffffff" />
  </g>

  <!-- Title & Branding -->
  <text x="400" y="695" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="0.08em" fill="#f8fafc">
    VYTAL
  </text>
  <circle cx="508" cy="682" r="6" fill="#14b8a6" />

  <!-- Tagline -->
  <text x="400" y="738" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="0.04em" fill="#94a3b8">
    Your Health, Decoded.
  </text>

  <!-- Subtitle -->
  <text x="400" y="776" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="0.22em" fill="#2dd4bf">
    EXPLAINABLE CLINICAL DECISION SUPPORT
  </text>

  <!-- Bottom Disclaimers & Standard Notice -->
  <text x="400" y="1120" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748b">
    Educational &amp; Research Platform • NOT A MEDICAL DEVICE
  </text>
  <text x="400" y="1144" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#475569">
    CURES 2005 • RxNorm • AHA/ACC Emergency Triage
  </text>
</svg>
