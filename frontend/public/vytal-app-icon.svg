<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="appWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="40%" stop-color="#0d9488" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="iconPulseGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#14b8a6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#appBgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="4" y="4" width="504" height="504" rx="112" stroke="#134e4a" stroke-width="3" fill="none" opacity="0.6" />

  <!-- Geometric V Waveform Path -->
  <path
    d="M120 148 L204 340 L238 382 L274 180 L316 332 L344 290 L392 148"
    stroke="url(#appWaveGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#iconPulseGlow)"
  />

  <!-- Cardiometabolic Diagnostic Apex Indicator -->
  <circle cx="274" cy="180" r="22" fill="#34d399" />
  <circle cx="274" cy="180" r="10" fill="#ffffff" />
</svg>
