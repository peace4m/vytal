<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vytalTealEmeraldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softShadowPrimary" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Container -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="16" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5" />
    <path
      d="M20 22 L33 50 L38 56 L43 26 L48 50 L52 44 L60 22"
      stroke="url(#vytalTealEmeraldPrimary)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#softShadowPrimary)"
    />
    <circle cx="43" cy="26" r="3" fill="#10b981" />
    <circle cx="43" cy="26" r="1.2" fill="#ffffff" />
  </g>

  <!-- VYTAL Wordmark -->
  <text x="88" y="45" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" letter-spacing="0.05em" fill="#0f172a">
    VYTAL
  </text>

  <!-- Brand Dot Accent -->
  <circle cx="218" cy="40" r="4" fill="#0d9488" />

  <!-- Subtitle Tagline -->
  <text x="89" y="61" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.18em" fill="#0d9488">
