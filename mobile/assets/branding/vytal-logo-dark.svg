<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vytalTealEmeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="softGlowDark" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#14b8a6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Container -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="16" fill="#134e4a" stroke="#0f766e" stroke-width="1.5" />
    <path
      d="M20 22 L33 50 L38 56 L43 26 L48 50 L52 44 L60 22"
      stroke="url(#vytalTealEmeraldDark)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#softGlowDark)"
    />
    <circle cx="43" cy="26" r="3" fill="#34d399" />
    <circle cx="43" cy="26" r="1.2" fill="#ffffff" />
  </g>

  <!-- VYTAL Wordmark in White -->
  <text x="88" y="45" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" letter-spacing="0.05em" fill="#f8fafc">
    VYTAL
  </text>

  <!-- Brand Dot Accent -->
  <circle cx="218" cy="40" r="4" fill="#2dd4bf" />

  <!-- Subtitle Tagline in Bright Teal -->
  <text x="89" y="61" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9.5" letter-spacing="0.18em" fill="#2dd4bf">
    CLINICAL DECISION SUPPORT
  </text>
</svg>
